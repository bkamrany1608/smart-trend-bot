name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
defaults:
  run:
    working-directory: smart_trend_bot
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        working-directory: .
        run: unzip -o smart_trend_bot.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Android scaffold
        run: |
          flutter create --platforms android --project-name smart_trend_bot --org com.smarttrend /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          python tools/patch_manifest.py
      - run: flutter pub get
      - name: Download real historical data
        run: python tools/fetch_data.py
        continue-on-error: true
      - name: Backtest and optimize
        run: dart run tool/optimize.dart
        continue-on-error: true
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: smart-trend-bot-apk
          path: smart_trend_bot/build/app/outputs/flutter-apk/app-release.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Smart Trend Bot build ${{ github.run_number }}
          files: |
            smart_trend_bot/build/app/outputs/flutter-apk/app-release.apk
            smart_trend_bot/reports/optimization.md
